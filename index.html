<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#04335B" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Welfare" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Pangasius Welfare Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: #04335B; font-family: 'Nunito', -apple-system, system-ui, sans-serif; }
  #root { min-height: 100vh; }
  button { font-family: inherit; }
  input, select { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  #errbox { display:none; padding:20px; color:#fff; font-family:monospace; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="root"></div>
<pre id="errbox"></pre>
<script>
function showErr(msg){var b=document.getElementById('errbox');if(b){b.style.display='block';b.textContent="App error:\n"+msg;}}
window.addEventListener('error', function(e){ showErr((e.error&&e.error.stack)||e.message||String(e)); });
window.storage = {
  get:function(key){return new Promise(function(res,rej){var v=localStorage.getItem(key);if(v===null){rej(new Error("not found"));}else{res({key:key,value:v,shared:false});}});},
  set:function(key,value){return new Promise(function(res){localStorage.setItem(key,value);res({key:key,value:value,shared:false});});},
  delete:function(key){return new Promise(function(res){localStorage.removeItem(key);res({key:key,deleted:true,shared:false});});},
  list:function(prefix){return new Promise(function(res){var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!prefix||k.indexOf(prefix)===0)keys.push(k);}res({keys:keys,prefix:prefix,shared:false});});}
};
/* ---- PWA additions (DeltaCare field-test build) ---------------------------- */
/* Optional: paste your Google Apps Script web-app URL between the quotes to
   pre-fill Settings for every tester. Leave empty to have testers paste it
   themselves. Only applied when the device has no URL saved yet. */
var DEFAULT_SYNC_URL = "";
try {
  if (DEFAULT_SYNC_URL && localStorage.getItem("settings:syncUrl") === null) {
    localStorage.setItem("settings:syncUrl", DEFAULT_SYNC_URL);
  }
} catch (e) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("SW registration failed", e); });
  });
}
</script>

o screening",vi:"Kh\xF4ng r\xF5 ngu\u1ED3n; kh\xF4ng s\xE0ng l\u1ECDc"}}},{id:"disposal",stages:["h","n","g"],name:{en:"Mortality disposal",vi:"X\u1EED l\xFD c\xE1 ch\u1EBFt"},bands:{1:{en:"Removed daily; disposed safely",vi:"V\u1EDBt h\xE0ng ng\xE0y; x\u1EED l\xFD an to\xE0n"},2:{en:"Irregular; inadequate",vi:"Kh\xF4ng \u0111\u1EC1u; ch\u01B0a \u0111\u1EA3m b\u1EA3o"},3:{en:"Rarely removed / into channels",vi:"Hi\u1EBFm khi v\u1EDBt / th\u1EA3i ra k\xEAnh"}}}]},{id:"fishhealth",icon:Ou,color:"#E11D48",name:{en:"Fish Body Check",vi:"Ki\u1EC3m tra c\u01A1 th\u1EC3 c\xE1"},intro:{en:"Look at a sample of fish and choose the picture that best matches each body part.",vi:"Quan s\xE1t m\u1ED9t m\u1EABu c\xE1 v\xE0 ch\u1ECDn h\xECnh m\xF4 t\u1EA3 \u0111\xFAng nh\u1EA5t t\u1EEBng b\u1ED9 ph\u1EADn."},indicators:[{id:"eyes",stages:["h","n","g","p"],visual:!0,weight:2,name:{en:"Eyes",vi:"M\u1EAFt"},bands:{1:{en:"Both eyes normal; no injury or abnormality",vi:"C\u1EA3 hai m\u1EAFt b\xECnh th\u01B0\u1EDDng; kh\xF4ng th\u01B0\u01A1ng t\xEDch"},2:{en:"One eye affected: swelling, bleeding or burst eye",vi:"M\u1ED9t m\u1EAFt b\u1ECB: s\u01B0ng, ch\u1EA3y m\xE1u ho\u1EB7c v\u1EE1"},3:{en:"Both eyes abnormal; bleeding, burst or impaired vision",vi:"C\u1EA3 hai m\u1EAFt b\u1EA5t th\u01B0\u1EDDng; ch\u1EA3y m\xE1u, v\u1EE1 ho\u1EB7c gi\u1EA3m th\u1ECB l\u1EF1c"}}},{id:"operculum",stages:["h","n","g","p"],visual:!0,weight:2,name:{en:"Operculum (gill cover)",vi:"N\u1EAFp mang"},bands:{1:{en:"Normal; no missing tissue, bleeding or redness",vi:"B\xECnh th\u01B0\u1EDDng; kh\xF4ng m\u1EA5t m\xF4, ch\u1EA3y m\xE1u hay \u0111\u1ECF"},2:{en:"Missing less than 25% of tissue",vi:"M\u1EA5t d\u01B0\u1EDBi 25% m\xF4"},3:{en:"Bleeding, redness and 25%+ tissue loss",vi:"Ch\u1EA3y m\xE1u, \u0111\u1ECF v\xE0 m\u1EA5t 25%+ m\xF4"}}},{id:"jaw",stages:["h","n","g","p"],visual:!0,weight:2,name:{en:"Jaw / mouth",vi:"H\xE0m / mi\u1EC7ng"},bands:{1:{en:"Normal; no deformity, injury or lesion",vi:"B\xECnh th\u01B0\u1EDDng; kh\xF4ng d\u1ECB d\u1EA1ng, th\u01B0\u01A1ng t\xEDch"},2:{en:"Tolerable deformity; minor injury or redness; feeding OK",vi:"D\u1ECB d\u1EA1ng nh\u1EB9; th\u01B0\u01A1ng t\xEDch nh\u1ECF; v\u1EABn \u0103n \u0111\u01B0\u1EE3c"},3:{en:"Severe deformity affecting feeding; bleeding or injury",vi:"D\u1ECB d\u1EA1ng n\u1EB7ng \u1EA3nh h\u01B0\u1EDFng \u0103n; ch\u1EA3y m\xE1u ho\u1EB7c th\u01B0\u01A1ng t\xEDch"}}},{id:"skin",stages:["h","n","g","p"],visual:!0,weight:3,name:{en:"Skin",vi:"Da"},bands:{1:{en:"Healthy; no lesions, scratches, abrasions, bleeding or injury",vi:"Kh\u1ECFe; kh\xF4ng t\u1ED5n th\u01B0\u01A1ng, tr\u1EA7y x\u01B0\u1EDBc, m\xE0i m\xF2n, ch\u1EA3y m\xE1u hay th\u01B0\u01A1ng t\xEDch"},2:{en:"Minor scratches/abrasions or a localised lesion/ulcer smaller than 1 cm\xB2",vi:"Tr\u1EA7y x\u01B0\u1EDBc/m\xE0i m\xF2n nh\u1EB9 ho\u1EB7c t\u1ED5n th\u01B0\u01A1ng/lo\xE9t c\u1EE5c b\u1ED9 nh\u1ECF h\u01A1n 1 cm\xB2"},3:{en:"Lesions over 1 cm\xB2, deep scratches/abrasions; ulcers, necrosis, redness, bleeding or parasites",vi:"T\u1ED5n th\u01B0\u01A1ng tr\xEAn 1 cm\xB2, tr\u1EA7y x\u01B0\u1EDBc/m\xE0i m\xF2n s\xE2u; lo\xE9t, ho\u1EA1i t\u1EED, \u0111\u1ECF, ch\u1EA3y m\xE1u ho\u1EB7c k\xFD sinh"}}},{id:"fins",stages:["h","n","g","p"],visual:!0,weight:2,name:{en:"Fins",vi:"V\xE2y"},bands:{1:{en:"Normal; no erosion, bleeding, cracks or lesions",vi:"B\xECnh th\u01B0\u1EDDng; kh\xF4ng m\xF2n, ch\u1EA3y m\xE1u, n\u1EE9t hay t\u1ED5n th\u01B0\u01A1ng"},2:{en:"Slight split; scar tissue or mild necrosis",vi:"N\u1EE9t nh\u1EB9; m\xF4 s\u1EB9o ho\u1EB7c ho\u1EA1i t\u1EED nh\u1EB9"},3:{en:"Severe splitting; necrosis, bleeding or parasites",vi:"N\u1EE9t n\u1EB7ng; ho\u1EA1i t\u1EED, ch\u1EA3y m\xE1u ho\u1EB7c k\xFD sinh"}}},{id:"gills",stages:["h","n","g","p"],visual:!0,weight:3,name:{en:"Gills",vi:"Mang"},bands:{1:{en:"Bright red; no wounds, lesions or parasites",vi:"\u0110\u1ECF t\u01B0\u01A1i; kh\xF4ng v\u1EBFt th\u01B0\u01A1ng, t\u1ED5n th\u01B0\u01A1ng hay k\xFD sinh"},2:{en:"Mild injury, necrosis, splitting or thickening",vi:"Th\u01B0\u01A1ng t\xEDch nh\u1EB9, ho\u1EA1i t\u1EED, n\u1EE9t ho\u1EB7c d\xE0y l\xEAn"},3:{en:"Bleeding, pallor, severe necrosis, excess mucus or parasites",vi:"Ch\u1EA3y m\xE1u, nh\u1EE3t, ho\u1EA1i t\u1EED n\u1EB7ng, nhi\u1EC1u nh\u1EDBt ho\u1EB7c k\xFD sinh"}}},{id:"spine",stages:["h","n","g","p"],visual:!0,weight:2,name:{en:"Spine",vi:"C\u1ED9t s\u1ED1ng"},bands:{1:{en:"Normal structure; normal weight",vi:"C\u1EA5u tr\xFAc b\xECnh th\u01B0\u1EDDng; c\xE2n n\u1EB7ng b\xECnh th\u01B0\u1EDDng"},2:{en:"Slight curvature (lordosis/scoliosis/kyphosis); normal weight",vi:"Cong nh\u1EB9 (lordosis/scoliosis/kyphosis); c\xE2n n\u1EB7ng b\xECnh th\u01B0\u1EDDng"},3:{en:"Severe curvature with wasting / weight loss",vi:"Cong n\u1EB7ng k\xE8m g\u1EA7y y\u1EBFu / s\u1EE5t c\xE2n"}}}]}],Xi={temp:{what:{en:"Water temperature, in \xB0C.",vi:"Nhi\u1EC7t \u0111\u1ED9 n\u01B0\u1EDBc, t\xEDnh b\u1EB1ng \xB0C."},why:{en:"Pangasius are tropical fish that thrive at 27\u201330 \xB0C. Outside this range their metabolism, appetite and immune function are stressed. Higher temperatures also lower oxygen solubility and shift ammonia toward its more toxic form.",vi:"C\xE1 tra l\xE0 lo\xE0i nhi\u1EC7t \u0111\u1EDBi, ph\xE1t tri\u1EC3n t\u1ED1t \u1EDF 27\u201330 \xB0C. Ngo\xE0i kho\u1EA3ng n\xE0y, trao \u0111\u1ED5i ch\u1EA5t, s\u1EE9c \u0103n v\xE0 mi\u1EC5n d\u1ECBch b\u1ECB c\u0103ng th\u1EB3ng. Nhi\u1EC7t \u0111\u1ED9 cao c\xF2n l\xE0m gi\u1EA3m oxy h\xF2a tan v\xE0 t\u0103ng d\u1EA1ng amoniac \u0111\u1ED9c h\u01A1n."},thresholds:{en:"27\u201330 \xB0C is the natural optimum across all stages. 24\u201326 / 31\u201332 \xB0C is tolerable but stressful. Below 24 or above 32 \xB0C is harmful (above 32 \xB0C can kill embryos). Sources: Decision 1673/2013; 28 TCN 211:2004; Islam et al. 2019.",vi:"27\u201330 \xB0C l\xE0 t\u1ED1i \u01B0u t\u1EF1 nhi\xEAn \u1EDF m\u1ECDi giai \u0111o\u1EA1n. 24\u201326 / 31\u201332 \xB0C ch\u1ECBu \u0111\u01B0\u1EE3c nh\u01B0ng g\xE2y c\u0103ng th\u1EB3ng. D\u01B0\u1EDBi 24 ho\u1EB7c tr\xEAn 32 \xB0C g\xE2y h\u1EA1i (tr\xEAn 32 \xB0C c\xF3 th\u1EC3 l\xE0m ch\u1EBFt ph\xF4i). Ngu\u1ED3n: Quy\u1EBFt \u0111\u1ECBnh 1673/2013; 28 TCN 211:2004; Islam v\xE0 cs. 2019."},tip:{en:"Maintain deeper water and partial shade in hot periods; avoid stocking or handling during temperature extremes.",vi:"Gi\u1EEF n\u01B0\u1EDBc s\xE2u h\u01A1n v\xE0 che b\xF3ng m\u1ED9t ph\u1EA7n khi n\u1EAFng n\xF3ng; tr\xE1nh th\u1EA3 ho\u1EB7c b\u1EAFt c\xE1 l\xFAc nhi\u1EC7t \u0111\u1ED9 c\u1EF1c \u0111oan."}},ph:{what:{en:"Acidity/alkalinity of the water (0\u201314 scale).",vi:"\u0110\u1ED9 axit/ki\u1EC1m c\u1EE7a n\u01B0\u1EDBc (thang 0\u201314)."},why:{en:"Stable pH near neutral supports gill function and reduces stress. Swings or extremes irritate gills and skin and increase the toxicity of ammonia.",vi:"pH \u1ED5n \u0111\u1ECBnh g\u1EA7n trung t\xEDnh gi\xFAp mang ho\u1EA1t \u0111\u1ED9ng t\u1ED1t v\xE0 gi\u1EA3m c\u0103ng th\u1EB3ng. Dao \u0111\u1ED9ng ho\u1EB7c c\u1EF1c tr\u1ECB g\xE2y k\xEDch \u1EE9ng mang v\xE0 da, t\u0103ng \u0111\u1ED9c t\xEDnh amoniac."},thresholds:{en:"7.0\u20138.5 is the general target (egg incubation prefers a tighter 6.8\u20137.5). 6.5\u20136.99 or 8.51\u20139.0 needs watching. Below 6.5 or above 9.0 is harmful, especially as it raises ammonia toxicity. Sources: Decision 1673/2013; 28 TCN 211:2004; QCVN 02-20:2014; Waycott 2015.",vi:"7,0\u20138,5 l\xE0 m\u1EE5c ti\xEAu chung (\u1EA5p tr\u1EE9ng n\xEAn 6,8\u20137,5). 6,5\u20136,99 ho\u1EB7c 8,51\u20139,0 c\u1EA7n theo d\xF5i. D\u01B0\u1EDBi 6,5 ho\u1EB7c tr\xEAn 9,0 g\xE2y h\u1EA1i, nh\u1EA5t l\xE0 do t\u0103ng \u0111\u1ED9c t\xEDnh amoniac. Ngu\u1ED3n: Quy\u1EBFt \u0111\u1ECBnh 1673/2013; 28 TCN 211:2004; QCVN 02-20:2014; Waycott 2015."},tip:{en:"Check pH at dawn and afternoon (it rises through the day with algae); lime ponds to stabilise low pH.",vi:"\u0110o pH l\xFAc r\u1EA1ng s\xE1ng v\xE0 bu\u1ED5i chi\u1EC1u (pH t\u0103ng trong ng\xE0y do t\u1EA3o); b\xF3n v\xF4i \u0111\u1EC3 \u1ED5n \u0111\u1ECBnh pH th\u1EA5p."}},do:{what:{en:"Dissolved oxygen available in the water, in mg/L.",vi:"L\u01B0\u1EE3ng oxy h\xF2a tan trong n\u01B0\u1EDBc, mg/L."},why:{en:"Although pangasius can breathe air, relying on air-breathing is energetically costly and signals poor conditions. Prolonged low oxygen causes chronic stress, poor growth and disease.",vi:"D\xF9 c\xE1 tra th\u1EDF \u0111\u01B0\u1EE3c kh\xED tr\u1EDDi, vi\u1EC7c ph\u1EA3i ngoi l\xEAn th\u1EDF t\u1ED1n nhi\u1EC1u n\u0103ng l\u01B0\u1EE3ng v\xE0 b\xE1o hi\u1EC7u \u0111i\u1EC1u ki\u1EC7n x\u1EA5u. Thi\u1EBFu oxy k\xE9o d\xE0i g\xE2y c\u0103ng th\u1EB3ng m\xE3n t\xEDnh, ch\u1EADm l\u1EDBn v\xE0 b\u1EC7nh."},thresholds:{en:"Targets differ by stage: hatchery/egg incubation above 4 mg/L; nursery above 3 mg/L; grow-out above 3.5 mg/L. 2\u20133 mg/L needs attention. Below 2 mg/L is a serious welfare risk even though fish may survive it. Sources: Decision 1673/2013; 28 TCN 211:2004; QCVN 02-20:2014.",vi:"M\u1EE5c ti\xEAu kh\xE1c theo giai \u0111o\u1EA1n: tr\u1EA1i gi\u1ED1ng/\u1EA5p tr\xEAn 4 mg/L; \u01B0\u01A1ng tr\xEAn 3 mg/L; nu\xF4i th\u1ECBt tr\xEAn 3,5 mg/L. 2\u20133 mg/L c\u1EA7n ch\xFA \xFD. D\u01B0\u1EDBi 2 mg/L l\xE0 r\u1EE7i ro nghi\xEAm tr\u1ECDng d\xF9 c\xE1 c\xF3 th\u1EC3 s\u1ED1ng. Ngu\u1ED3n: Quy\u1EBFt \u0111\u1ECBnh 1673/2013; 28 TCN 211:2004; QCVN 02-20:2014."},tip:{en:"Run paddlewheel or diffused aerators at night and early morning, when oxygen is lowest.",vi:"Ch\u1EA1y qu\u1EA1t n\u01B0\u1EDBc ho\u1EB7c s\u1EE5c kh\xED v\xE0o ban \u0111\xEAm v\xE0 s\xE1ng s\u1EDBm, khi oxy th\u1EA5p nh\u1EA5t."}},ammonia:{what:{en:"Un-ionised (toxic) ammonia, NH\u2083, in mg/L.",vi:"Amoniac kh\xF4ng ion h\xF3a (\u0111\u1ED9c), NH\u2083, mg/L."},why:{en:"Ammonia comes from fish waste and uneaten feed. The un-ionised form is highly toxic, damaging gills, impairing growth and raising disease and mortality. It rises when oxygen is low and the nitrogen cycle is incomplete.",vi:"Amoniac sinh ra t\u1EEB ch\u1EA5t th\u1EA3i c\xE1 v\xE0 th\u1EE9c \u0103n th\u1EEBa. D\u1EA1ng kh\xF4ng ion h\xF3a r\u1EA5t \u0111\u1ED9c, g\xE2y h\u1EA1i mang, k\xECm h\xE3m t\u0103ng tr\u01B0\u1EDFng, t\u0103ng b\u1EC7nh v\xE0 ch\u1EBFt. N\xF3 t\u0103ng khi thi\u1EBFu oxy v\xE0 chu tr\xECnh nit\u01A1 kh\xF4ng ho\xE0n ch\u1EC9nh."},thresholds:{en:"Targets tighten for early life: hatchery/egg incubation below 0.05 mg/L; broodstock below 0.09 mg/L; grow-out below 0.3 mg/L. Up to about double the stage target needs attention; well above is harmful. Toxicity rises with higher temperature and pH. Sources: Decision 1673/2013; QCVN 02-20:2014; Truc et al. 2023.",vi:"M\u1EE5c ti\xEAu ch\u1EB7t h\u01A1n \u1EDF giai \u0111o\u1EA1n \u0111\u1EA7u \u0111\u1EDDi: tr\u1EA1i gi\u1ED1ng/\u1EA5p d\u01B0\u1EDBi 0,05 mg/L; c\xE1 b\u1ED1 m\u1EB9 d\u01B0\u1EDBi 0,09 mg/L; nu\xF4i th\u1ECBt d\u01B0\u1EDBi 0,3 mg/L. T\u1EDBi kho\u1EA3ng g\u1EA5p \u0111\xF4i m\u1EE5c ti\xEAu c\u1EA7n ch\xFA \xFD; cao h\u01A1n nhi\u1EC1u g\xE2y h\u1EA1i. \u0110\u1ED9c t\xEDnh t\u0103ng theo nhi\u1EC7t \u0111\u1ED9 v\xE0 pH. Ngu\u1ED3n: Quy\u1EBFt \u0111\u1ECBnh 1673/2013; QCVN 02-20:2014; Truc v\xE0 cs. 2023."},tip:{en:"Avoid overfeeding, remove sludge, and keep oxygen up so beneficial bacteria can convert ammonia.",vi:"Tr\xE1nh cho \u0103n d\u01B0, h\xFAt b\xF9n \u0111\xE1y, v\xE0 gi\u1EEF oxy cao \u0111\u1EC3 vi khu\u1EA9n c\xF3 l\u1EE3i chuy\u1EC3n h\xF3a amoniac."}},nitrite:{what:{en:"Nitrite (NO\u2082\u207B), an intermediate of the nitrogen cycle, in mg/L.",vi:"Nitrit (NO\u2082\u207B), ch\u1EA5t trung gian c\u1EE7a chu tr\xECnh nit\u01A1, mg/L."},why:{en:"Nitrite enters the blood and blocks oxygen transport (\u201Cbrown blood\u201D), compounding low-oxygen stress. It builds up when the bacteria that complete the nitrogen cycle are disrupted by low oxygen.",vi:"Nitrit v\xE0o m\xE1u v\xE0 c\u1EA3n tr\u1EDF v\u1EADn chuy\u1EC3n oxy (\u201Cm\xE1u n\xE2u\u201D), l\xE0m tr\u1EA7m tr\u1ECDng th\xEAm t\xECnh tr\u1EA1ng thi\u1EBFu oxy. N\xF3 t\xEDch t\u1EE5 khi vi khu\u1EA9n ho\xE0n t\u1EA5t chu tr\xECnh nit\u01A1 b\u1ECB gi\xE1n \u0111o\u1EA1n do thi\u1EBFu oxy."},thresholds:{en:"Egg incubation is most sensitive (below 0.01 mg/L); nursery and grow-out below 0.06 mg/L. 0.06\u20131.6 mg/L needs attention. 1.7 mg/L or above is harmful. Sources: Decision 1673/2013; Yosmaniar et al. 2021.",vi:"\u1EA4p tr\u1EE9ng nh\u1EA1y c\u1EA3m nh\u1EA5t (d\u01B0\u1EDBi 0,01 mg/L); \u01B0\u01A1ng v\xE0 nu\xF4i th\u1ECBt d\u01B0\u1EDBi 0,06 mg/L. 0,06\u20131,6 mg/L c\u1EA7n ch\xFA \xFD. T\u1EEB 1,7 mg/L tr\u1EDF l\xEAn g\xE2y h\u1EA1i. Ngu\u1ED3n: Quy\u1EBFt \u0111\u1ECBnh 1673/2013; Yosmaniar v\xE0 cs. 2021."},tip:{en:"Maintain aeration and avoid sudden organic loading; adding salt can reduce nitrite toxicity.",vi:"Duy tr\xEC s\u1EE5c kh\xED v\xE0 tr\xE1nh t\u0103ng t\u1EA3i h\u1EEFu c\u01A1 \u0111\u1ED9t ng\u1ED9t; th\xEAm mu\u1ED1i c\xF3 th\u1EC3 gi\u1EA3m \u0111\u1ED9c t\xEDnh nitrit."}},monitor:{what:{en:"How often water quality is actually tested and recorded.",vi:"T\u1EA7n su\u1EA5t n\u01B0\u1EDBc th\u1EF1c s\u1EF1 \u0111\u01B0\u1EE3c ki\u1EC3m tra v\xE0 ghi ch\xE9p."},why:{en:"Most water problems are invisible until fish are already stressed. Regular measured readings catch problems early; relying only on water colour or fish behaviour means acting too late.",vi:"H\u1EA7u h\u1EBFt v\u1EA5n \u0111\u1EC1 v\u1EC1 n\u01B0\u1EDBc kh\xF4ng th\u1EA5y \u0111\u01B0\u1EE3c cho \u0111\u1EBFn khi c\xE1 \u0111\xE3 c\u0103ng th\u1EB3ng. \u0110o th\u01B0\u1EDDng xuy\xEAn gi\xFAp ph\xE1t hi\u1EC7n s\u1EDBm; ch\u1EC9 d\u1EF1a v\xE0o m\xE0u n\u01B0\u1EDBc hay t\u1EADp t\xEDnh c\xE1 l\xE0 h\xE0nh \u0111\u1ED9ng qu\xE1 mu\u1ED9n."},thresholds:{en:"Daily testing with records is best. Weekly needs attention. Monthly or not measuring leaves problems undetected.",vi:"\u0110o v\xE0 ghi ch\xE9p h\xE0ng ng\xE0y l\xE0 t\u1ED1t nh\u1EA5t. H\xE0ng tu\u1EA7n c\u1EA7n ch\xFA \xFD. H\xE0ng th\xE1ng ho\u1EB7c kh\xF4ng \u0111o s\u1EBD b\u1ECF s\xF3t v\u1EA5n \u0111\u1EC1."},tip:{en:"Test at least DO, pH and temperature daily during the last two months before harvest, when risk peaks.",vi:"\xCDt nh\u1EA5t \u0111o DO, pH v\xE0 nhi\u1EC7t \u0111\u1ED9 h\xE0ng ng\xE0y trong hai th\xE1ng cu\u1ED1i tr\u01B0\u1EDBc thu ho\u1EA1ch, khi r\u1EE7i ro cao nh\u1EA5t."}},"density-g":{what:{en:"Grow-out biomass per water volume (kg/m\xB3), with a fish/m\xB2 guide.",vi:"Sinh kh\u1ED1i tr\xEAn th\u1EC3 t\xEDch n\u01B0\u1EDBc khi nu\xF4i th\u1ECBt (kg/m\xB3), k\xE8m h\u01B0\u1EDBng d\u1EABn con/m\xB2."},why:{en:"High density increases competition for oxygen and food, raises stress and disease, and slows growth. kg/m\xB3 is used because fish/m\xB2 ignores fish size and pond depth.",vi:"M\u1EADt \u0111\u1ED9 cao t\u0103ng c\u1EA1nh tranh oxy v\xE0 th\u1EE9c \u0103n, t\u0103ng c\u0103ng th\u1EB3ng v\xE0 b\u1EC7nh, l\xE0m ch\u1EADm l\u1EDBn. D\xF9ng kg/m\xB3 v\xEC con/m\xB2 b\u1ECF qua c\u1EE1 c\xE1 v\xE0 \u0111\u1ED9 s\xE2u ao."},thresholds:{en:"Below 38 kg/m\xB3 is good. 38\u201350 needs attention. Above 50 kg/m\xB3 is a priority. Stocking over ~44 fish/m\xB2 is linked to lower survival and higher FCR.",vi:"D\u01B0\u1EDBi 38 kg/m\xB3 t\u1ED1t. 38\u201350 c\u1EA7n ch\xFA \xFD. Tr\xEAn 50 kg/m\xB3 l\xE0 \u01B0u ti\xEAn. Th\u1EA3 tr\xEAn ~44 con/m\xB2 li\xEAn quan \u0111\u1EBFn t\u1EF7 l\u1EC7 s\u1ED1ng th\u1EA5p v\xE0 FCR cao."},tip:{en:"Plan stocking against expected harvest biomass, not just fish count, so you don't exceed safe density at harvest.",vi:"T\xEDnh m\u1EADt \u0111\u1ED9 th\u1EA3 theo sinh kh\u1ED1i thu ho\u1EA1ch d\u1EF1 ki\u1EBFn, kh\xF4ng ch\u1EC9 s\u1ED1 con, \u0111\u1EC3 kh\xF4ng v\u01B0\u1EE3t m\u1EADt \u0111\u1ED9 an to\xE0n l\xFAc thu."}},"density-n":{what:{en:"Stocking density during the nursery phase, which has two sub-phases: larvae\u2192fry and fry\u2192fingerling.",vi:"M\u1EADt \u0111\u1ED9 th\u1EA3 trong giai \u0111o\u1EA1n \u01B0\u01A1ng, g\u1ED3m hai giai \u0111o\u1EA1n nh\u1ECF: c\xE1 b\u1ED9t\u2192h\u01B0\u01A1ng v\xE0 h\u01B0\u01A1ng\u2192gi\u1ED1ng."},why:{en:"Young fish are fragile; crowding causes cannibalism (in larvae), size variation, competition and stress that carry through to grow-out.",vi:"C\xE1 nh\u1ECF r\u1EA5t y\u1EBFu; ch\u1EADt ch\u1ED9i g\xE2y \u0103n l\u1EABn nhau (\u1EDF c\xE1 b\u1ED9t), ch\xEAnh l\u1EC7ch c\u1EE1, c\u1EA1nh tranh v\xE0 c\u0103ng th\u1EB3ng k\xE9o d\xE0i \u0111\u1EBFn giai \u0111o\u1EA1n nu\xF4i th\u1ECBt."},thresholds:{en:"Larvae\u2192fry: 250\u2013500/m\xB2 good, 500\u2013800/m\xB2 attention, over 800/m\xB2 priority. Fry\u2192fingerling: up to 200/m\xB2 good, 200\u2013300/m\xB2 attention, over 300/m\xB2 priority. (Sources: 28 TCN 211:2004; Nguyen et al. 2013; Phuong et al. 2011; Bui et al. 2010.)",vi:"C\xE1 b\u1ED9t\u2192h\u01B0\u01A1ng: 250\u2013500/m\xB2 t\u1ED1t, 500\u2013800/m\xB2 c\u1EA7n ch\xFA \xFD, tr\xEAn 800/m\xB2 \u01B0u ti\xEAn. H\u01B0\u01A1ng\u2192gi\u1ED1ng: t\u1EDBi 200/m\xB2 t\u1ED1t, 200\u2013300/m\xB2 c\u1EA7n ch\xFA \xFD, tr\xEAn 300/m\xB2 \u01B0u ti\xEAn. (Ngu\u1ED3n: 28 TCN 211:2004; Nguyen v\xE0 cs. 2013; Phuong v\xE0 cs. 2011; Bui v\xE0 cs. 2010.)"},tip:{en:"Grade and split batches as they grow to keep density and size even.",vi:"Ph\xE2n c\u1EE1 v\xE0 t\xE1ch \u0111\xE0n khi c\xE1 l\u1EDBn \u0111\u1EC3 gi\u1EEF m\u1EADt \u0111\u1ED9 v\xE0 c\u1EE1 \u0111\u1ED3ng \u0111\u1EC1u."}},"density-h":{what:{en:"Holding density of broodstock (parent fish) in the hatchery.",vi:"M\u1EADt \u0111\u1ED9 nu\xF4i c\xE1 b\u1ED1 m\u1EB9 trong tr\u1EA1i gi\u1ED1ng."},why:{en:"Broodstock need space and low stress for good condition and reproductive performance; crowding causes aggression and poor spawning.",vi:"C\xE1 b\u1ED1 m\u1EB9 c\u1EA7n kh\xF4ng gian v\xE0 \xEDt c\u0103ng th\u1EB3ng \u0111\u1EC3 kh\u1ECFe v\xE0 sinh s\u1EA3n t\u1ED1t; ch\u1EADt ch\u1ED9i g\xE2y \u0111\xE1nh nhau v\xE0 \u0111\u1EBB k\xE9m."},thresholds:{en:"0.4\u20130.5 kg/m\xB2 is best for condition (Nguyen et al. 2013); up to 1.0\u20131.2 kg/m\xB2 is acceptable (Decision 1673/2013). Above that, or visible crowding, needs attention; overcrowding with aggression is a priority.",vi:"0,4\u20130,5 kg/m\xB2 l\xE0 t\u1ED1t nh\u1EA5t cho th\u1EC3 tr\u1EA1ng (Nguyen v\xE0 cs. 2013); t\u1EDBi 1,0\u20131,2 kg/m\xB2 ch\u1EA5p nh\u1EADn \u0111\u01B0\u1EE3c (Quy\u1EBFt \u0111\u1ECBnh 1673/2013). Cao h\u01A1n, ho\u1EB7c th\u1EA5y ch\u1EADt, c\u1EA7n ch\xFA \xFD; qu\xE1 ch\u1EADt v\xE0 \u0111\xE1nh nhau l\xE0 \u01B0u ti\xEAn."},tip:{en:"Separate by size/sex where possible and provide ample volume per fish.",vi:"T\xE1ch theo c\u1EE1/gi\u1EDBi t\xEDnh n\u1EBFu c\xF3 th\u1EC3 v\xE0 \u0111\u1EA3m b\u1EA3o \u0111\u1EE7 th\u1EC3 t\xEDch cho m\u1ED7i con."}},uniformity:{what:{en:"How even fish are in size within the pond/tank.",vi:"M\u1EE9c \u0111\u1ED9 \u0111\u1ED3ng \u0111\u1EC1u c\u1EE1 c\xE1 trong ao/b\u1EC3."},why:{en:"Wide size variation signals unequal feed access and competition \u2014 larger fish dominate, weaker fish are stressed and grow poorly. It's a visible welfare and management warning sign.",vi:"Ch\xEAnh l\u1EC7ch c\u1EE1 l\u1EDBn cho th\u1EA5y ti\u1EBFp c\u1EADn th\u1EE9c \u0103n kh\xF4ng \u0111\u1EC1u v\xE0 c\u1EA1nh tranh \u2014 c\xE1 l\u1EDBn l\u1EA5n \xE1t, c\xE1 y\u1EBFu c\u0103ng th\u1EB3ng v\xE0 ch\u1EADm l\u1EDBn. \u0110\xE2y l\xE0 d\u1EA5u hi\u1EC7u c\u1EA3nh b\xE1o ph\xFAc l\u1EE3i v\xE0 qu\u1EA3n l\xFD."},thresholds:{en:"Uniform size is good; some variation needs attention; marked variation with out-competed weak fish is a priority.",vi:"C\u1EE1 \u0111\u1ED3ng \u0111\u1EC1u l\xE0 t\u1ED1t; c\xF3 ch\xEAnh l\u1EC7ch c\u1EA7n ch\xFA \xFD; ch\xEAnh l\u1EC7ch l\u1EDBn v\u1EDBi c\xE1 y\u1EBFu b\u1ECB l\u1EA5n \xE1t l\xE0 \u01B0u ti\xEAn."},tip:{en:"Improve feed distribution across the pond and grade fish to reduce dominance.",vi:"C\u1EA3i thi\u1EC7n r\u1EA3i th\u1EE9c \u0103n kh\u1EAFp ao v\xE0 ph\xE2n c\u1EE1 c\xE1 \u0111\u1EC3 gi\u1EA3m l\u1EA5n \xE1t."}},distribution:{what:{en:"How widely feed is spread across the water surface.",vi:"M\u1EE9c \u0111\u1ED9 th\u1EE9c \u0103n \u0111\u01B0\u1EE3c r\u1EA3i tr\xEAn m\u1EB7t n\u01B0\u1EDBc."},why:{en:"If feed lands in a small area, larger aggressive fish monopolise it and smaller fish miss out, driving size variation, stress and uneven growth.",vi:"N\u1EBFu th\u1EE9c \u0103n d\u1ED3n m\u1ED9t ch\u1ED7, c\xE1 l\u1EDBn hung h\u0103ng chi\u1EBFm h\u1EBFt v\xE0 c\xE1 nh\u1ECF thi\u1EBFu \u0103n, g\xE2y ch\xEAnh c\u1EE1, c\u0103ng th\u1EB3ng v\xE0 l\u1EDBn kh\xF4ng \u0111\u1EC1u."},thresholds:{en:"Spread over 75%+ of the surface is good; 50\u201374% needs attention; under 49% is a priority.",vi:"R\u1EA3i tr\xEAn 75%+ m\u1EB7t n\u01B0\u1EDBc l\xE0 t\u1ED1t; 50\u201374% c\u1EA7n ch\xFA \xFD; d\u01B0\u1EDBi 49% l\xE0 \u01B0u ti\xEAn."},tip:{en:"Use a moving boat or multiple feeding points rather than dumping feed in one spot.",vi:"D\xF9ng thuy\u1EC1n di chuy\u1EC3n ho\u1EB7c nhi\u1EC1u \u0111i\u1EC3m cho \u0103n thay v\xEC \u0111\u1ED5 d\u1ED3n m\u1ED9t ch\u1ED7."}},response:{what:{en:"How keenly fish come up to feed.",vi:"M\u1EE9c \u0111\u1ED9 c\xE1 l\xEAn b\u1EAFt m\u1ED3i."},why:{en:"Feeding response is one of the earliest signs of a problem. A sudden drop in appetite often means poor water quality or disease before other symptoms appear.",vi:"Ph\u1EA3n \u1EE9ng b\u1EAFt m\u1ED3i l\xE0 m\u1ED9t trong nh\u1EEFng d\u1EA5u hi\u1EC7u s\u1EDBm nh\u1EA5t. Gi\u1EA3m \u0103n \u0111\u1ED9t ng\u1ED9t th\u01B0\u1EDDng b\xE1o n\u01B0\u1EDBc x\u1EA5u ho\u1EB7c b\u1EC7nh tr\u01B0\u1EDBc khi c\xF3 tri\u1EC7u ch\u1EE9ng kh\xE1c."},thresholds:{en:"Active, vigorous feeding is good; slow or partial response needs attention; many fish off feed is a priority.",vi:"\u0102n m\u1EA1nh, h\u0103ng l\xE0 t\u1ED1t; ch\u1EADm ho\u1EB7c m\u1ED9t ph\u1EA7n c\u1EA7n ch\xFA \xFD; nhi\u1EC1u c\xE1 b\u1ECF \u0103n l\xE0 \u01B0u ti\xEAn."},tip:{en:"Watch the response at every feeding and check water quality immediately if it drops.",vi:"Quan s\xE1t ph\u1EA3n \u1EE9ng m\u1ED7i l\u1EA7n cho \u0103n v\xE0 ki\u1EC3m tra n\u01B0\u1EDBc ngay n\u1EBFu gi\u1EA3m."}},"protein-h":{what:{en:"Whether the broodstock (parent fish) receive a suitable conditioning diet.",vi:"C\xE1 b\u1ED1 m\u1EB9 c\xF3 \u0111\u01B0\u1EE3c cho \u0103n kh\u1EA9u ph\u1EA7n ph\xF9 h\u1EE3p \u0111\u1EC3 v\u1ED7 b\xE9o hay kh\xF4ng."},why:{en:"Pangasius hatcheries condition broodstock, spawn them, incubate eggs and sell day-old larvae \u2014 they do not rear larvae. Broodstock need a good conditioning diet for body condition and reproductive performance; a poor diet reduces egg quality and spawning success.",vi:"Tr\u1EA1i gi\u1ED1ng c\xE1 tra v\u1ED7 b\xE9o c\xE1 b\u1ED1 m\u1EB9, cho sinh s\u1EA3n, \u1EA5p tr\u1EE9ng v\xE0 b\xE1n c\xE1 b\u1ED9t m\u1ED9t ng\xE0y tu\u1ED5i \u2014 kh\xF4ng \u01B0\u01A1ng c\xE1 b\u1ED9t. C\xE1 b\u1ED1 m\u1EB9 c\u1EA7n kh\u1EA9u ph\u1EA7n v\u1ED7 b\xE9o t\u1ED1t \u0111\u1EC3 kh\u1ECFe v\xE0 sinh s\u1EA3n t\u1ED1t; kh\u1EA9u ph\u1EA7n k\xE9m l\xE0m gi\u1EA3m ch\u1EA5t l\u01B0\u1EE3ng tr\u1EE9ng v\xE0 t\u1EF7 l\u1EC7 \u0111\u1EBB."},thresholds:{en:"A conditioning diet of ~32\u201335% protein (commercial feed, or quality home-made feed of fish meal + rice bran + soybean/corn meal) is good; protein somewhat below 32% needs attention; a poor or unsuitable diet is a priority (Decision 1673/2013).",vi:"Kh\u1EA9u ph\u1EA7n v\u1ED7 b\xE9o ~32\u201335% \u0111\u1EA1m (th\u1EE9c \u0103n th\u01B0\u01A1ng m\u1EA1i, ho\u1EB7c t\u1EF1 l\xE0m \u0111\u1EA1t chu\u1EA9n g\u1ED3m b\u1ED9t c\xE1 + c\xE1m g\u1EA1o + b\u1ED9t \u0111\u1EADu n\xE0nh/ng\xF4) l\xE0 t\u1ED1t; \u0111\u1EA1m h\u01A1i d\u01B0\u1EDBi 32% c\u1EA7n ch\xFA \xFD; kh\u1EA9u ph\u1EA7n k\xE9m ho\u1EB7c kh\xF4ng ph\xF9 h\u1EE3p l\xE0 \u01B0u ti\xEAn (Quy\u1EBFt \u0111\u1ECBnh 1673/2013)."},tip:{en:"Use a recognised broodstock conditioning feed in the run-up to spawning.",vi:"D\xF9ng th\u1EE9c \u0103n v\u1ED7 b\xE9o c\xE1 b\u1ED1 m\u1EB9 \u0111\u01B0\u1EE3c c\xF4ng nh\u1EADn trong giai \u0111o\u1EA1n tr\u01B0\u1EDBc khi cho \u0111\u1EBB."}},"protein-n":{what:{en:"Crude protein content of feed (%) across the nursery, which rears day-old larvae (or ~1 g fry) through to fingerlings.",vi:"H\xE0m l\u01B0\u1EE3ng \u0111\u1EA1m th\xF4 c\u1EE7a th\u1EE9c \u0103n (%) trong giai \u0111o\u1EA1n \u01B0\u01A1ng, nu\xF4i c\xE1 b\u1ED9t m\u1ED9t ng\xE0y tu\u1ED5i (ho\u1EB7c c\xE1 h\u01B0\u01A1ng ~1 g) \u0111\u1EBFn c\xE1 gi\u1ED1ng."},why:{en:"Young fish need high protein for rapid early growth; feeding below the stage requirement slows growth and weakens fish.",vi:"C\xE1 nh\u1ECF c\u1EA7n \u0111\u1EA1m cao \u0111\u1EC3 l\u1EDBn nhanh giai \u0111o\u1EA1n \u0111\u1EA7u; cho \u0103n d\u01B0\u1EDBi m\u1EE9c y\xEAu c\u1EA7u c\u1EE7a giai \u0111o\u1EA1n l\xE0m ch\u1EADm l\u1EDBn v\xE0 y\u1EBFu c\xE1."},thresholds:{en:"On target by sub-phase: larvae\u2192fry 40\u201350%; fry\u2192fingerling 30\u201345% (Nguyen et al. 2013). Slightly below the stage target needs attention; well below is a priority.",vi:"\u0110\u1EA1t m\u1EE5c ti\xEAu theo giai \u0111o\u1EA1n nh\u1ECF: c\xE1 b\u1ED9t\u2192h\u01B0\u01A1ng 40\u201350%; h\u01B0\u01A1ng\u2192gi\u1ED1ng 30\u201345% (Nguyen v\xE0 cs. 2013). H\u01A1i d\u01B0\u1EDBi m\u1EE5c ti\xEAu c\u1EA7n ch\xFA \xFD; th\u1EA5p h\u01A1n nhi\u1EC1u l\xE0 \u01B0u ti\xEAn."},tip:{en:"Use a high-protein feed for early larvae/fry and step down to fry/fingerling grade as fish grow.",vi:"D\xF9ng th\u1EE9c \u0103n \u0111\u1EA1m cao cho c\xE1 b\u1ED9t/h\u01B0\u01A1ng giai \u0111o\u1EA1n \u0111\u1EA7u, gi\u1EA3m d\u1EA7n sang lo\u1EA1i h\u01B0\u01A1ng/gi\u1ED1ng khi c\xE1 l\u1EDBn."}},"protein-g":{what:{en:"Crude protein content of feed (%) for grow-out fish.",vi:"H\xE0m l\u01B0\u1EE3ng \u0111\u1EA1m th\xF4 c\u1EE7a th\u1EE9c \u0103n (%) cho c\xE1 nu\xF4i th\u1ECBt."},why:{en:"Grow-out fish need less protein than young fish; too little still slows growth and weakens fish, but excess is wasteful and fouls water.",vi:"C\xE1 nu\xF4i th\u1ECBt c\u1EA7n \xEDt \u0111\u1EA1m h\u01A1n c\xE1 nh\u1ECF; qu\xE1 \xEDt v\u1EABn l\xE0m ch\u1EADm l\u1EDBn v\xE0 y\u1EBFu c\xE1, nh\u01B0ng d\u01B0 th\u1EEBa l\xE3ng ph\xED v\xE0 l\xE0m b\u1EA9n n\u01B0\u1EDBc."},thresholds:{en:"25\u201330% is on target for grow-out. 20\u201325% needs attention; below 20% is a priority.",vi:"25\u201330% l\xE0 \u0111\u1EA1t m\u1EE5c ti\xEAu cho nu\xF4i th\u1ECBt. 20\u201325% c\u1EA7n ch\xFA \xFD; d\u01B0\u1EDBi 20% l\xE0 \u01B0u ti\xEAn."},tip:{en:"Use a grow-out grade feed; don't overfeed high-protein feed, which wastes money and pollutes the pond.",vi:"D\xF9ng th\u1EE9c \u0103n lo\u1EA1i nu\xF4i th\u1ECBt; kh\xF4ng cho \u0103n d\u01B0 th\u1EE9c \u0103n \u0111\u1EA1m cao, v\u1EEBa t\u1ED1n ti\u1EC1n v\u1EEBa g\xE2y \xF4 nhi\u1EC5m ao."}},"feedfreq-h":{what:{en:"Whether broodstock are fed regularly on a set schedule.",vi:"C\xE1 b\u1ED1 m\u1EB9 c\xF3 \u0111\u01B0\u1EE3c cho \u0103n \u0111\u1EC1u theo l\u1ECBch c\u1ED1 \u0111\u1ECBnh hay kh\xF4ng."},why:{en:"Regular feeding keeps broodstock in good condition for spawning. (Hatcheries do not rear larvae \u2014 larval feeding is assessed under the nursery stage.)",vi:"Cho \u0103n \u0111\u1EC1u gi\u1EEF c\xE1 b\u1ED1 m\u1EB9 \u1EDF th\u1EC3 tr\u1EA1ng t\u1ED1t \u0111\u1EC3 sinh s\u1EA3n. (Tr\u1EA1i gi\u1ED1ng kh\xF4ng \u01B0\u01A1ng c\xE1 b\u1ED9t \u2014 vi\u1EC7c cho c\xE1 b\u1ED9t \u0103n \u0111\u01B0\u1EE3c \u0111\xE1nh gi\xE1 \u1EDF giai \u0111o\u1EA1n \u01B0\u01A1ng.)"},thresholds:{en:"Fed twice a day (morning ~7\u20138am and late afternoon ~4\u20135pm), at roughly 2% body weight on commercial feed, adjusted to appetite, is good (Decision 1673/2013); somewhat irregular needs attention; poor or inconsistent feeding is a priority.",vi:"Cho \u0103n 2 l\u1EA7n/ng\xE0y (s\xE1ng ~7\u20138h v\xE0 chi\u1EC1u mu\u1ED9n ~16\u201317h), kho\u1EA3ng 2% tr\u1ECDng l\u01B0\u1EE3ng c\u01A1 th\u1EC3 v\u1EDBi th\u1EE9c \u0103n th\u01B0\u01A1ng m\u1EA1i, \u0111i\u1EC1u ch\u1EC9nh theo nhu c\u1EA7u, l\xE0 t\u1ED1t (Quy\u1EBFt \u0111\u1ECBnh 1673/2013); h\u01A1i th\u1EA5t th\u01B0\u1EDDng c\u1EA7n ch\xFA \xFD; cho \u0103n k\xE9m ho\u1EB7c kh\xF4ng \u0111\u1EC1u l\xE0 \u01B0u ti\xEAn."},tip:{en:"Keep broodstock on a consistent feeding routine, especially before spawning.",vi:"Gi\u1EEF ch\u1EBF \u0111\u1ED9 cho c\xE1 b\u1ED1 m\u1EB9 \u0103n \u1ED5n \u0111\u1ECBnh, nh\u1EA5t l\xE0 tr\u01B0\u1EDBc khi cho \u0111\u1EBB."}},"feedfreq-n":{what:{en:"How many times per day nursery fish are fed. The nursery receives day-old larvae (or sometimes ~1 g fry) and rears them to fingerlings.",vi:"S\u1ED1 l\u1EA7n cho c\xE1 \u0103n m\u1ED7i ng\xE0y giai \u0111o\u1EA1n \u01B0\u01A1ng. Giai \u0111o\u1EA1n \u01B0\u01A1ng nh\u1EADn c\xE1 b\u1ED9t m\u1ED9t ng\xE0y tu\u1ED5i (ho\u1EB7c \u0111\xF4i khi c\xE1 h\u01B0\u01A1ng ~1 g) v\xE0 nu\xF4i \u0111\u1EBFn c\xE1 gi\u1ED1ng."},why:{en:"Larvae have tiny stomachs and need frequent small feeds; too few feeds causes hunger, cannibalism and uneven growth.",vi:"C\xE1 b\u1ED9t d\u1EA1 d\xE0y nh\u1ECF, c\u1EA7n cho \u0103n \xEDt nh\u01B0ng nhi\u1EC1u l\u1EA7n; qu\xE1 \xEDt l\u1EA7n g\xE2y \u0111\xF3i, \u0103n l\u1EABn nhau v\xE0 l\u1EDBn kh\xF4ng \u0111\u1EC1u."},thresholds:{en:"Larvae\u2192fry recommended schedule (Nguyen et al. 2013): week 1 \u2014 5 feeds/day; week 2 \u2014 4 feeds/day; week 3 onward \u2014 3\u20134 feeds/day. Fry\u2192fingerling: 2\u20133 feeds/day (Nguyen 2013; Phuong 2011, 2012). Fewer needs attention; irregular is a priority.",vi:"L\u1ECBch khuy\u1EBFn c\xE1o c\xE1 b\u1ED9t\u2192h\u01B0\u01A1ng (Nguyen v\xE0 cs. 2013): tu\u1EA7n 1 \u2014 5 l\u1EA7n/ng\xE0y; tu\u1EA7n 2 \u2014 4 l\u1EA7n/ng\xE0y; t\u1EEB tu\u1EA7n 3 \u2014 3\u20134 l\u1EA7n/ng\xE0y. H\u01B0\u01A1ng\u2192gi\u1ED1ng: 2\u20133 l\u1EA7n/ng\xE0y (Nguyen 2013; Phuong 2011, 2012). \xCDt h\u01A1n c\u1EA7n ch\xFA \xFD; th\u1EA5t th\u01B0\u1EDDng l\xE0 \u01B0u ti\xEAn."},tip:{en:"Feed little and often in the first weeks, then reduce frequency gradually as fish grow.",vi:"Cho \u0103n \xEDt v\xE0 nhi\u1EC1u l\u1EA7n trong nh\u1EEFng tu\u1EA7n \u0111\u1EA7u, sau \u0111\xF3 gi\u1EA3m d\u1EA7n s\u1ED1 l\u1EA7n khi c\xE1 l\u1EDBn."}},"feedfreq-g":{what:{en:"How many times per day grow-out fish are fed.",vi:"S\u1ED1 l\u1EA7n cho c\xE1 nu\xF4i th\u1ECBt \u0103n m\u1ED7i ng\xE0y."},why:{en:"Consistent feeding supports even growth and good feed conversion; irregular feeding causes hunger, competition and waste.",vi:"Cho \u0103n \u0111\u1EC1u gi\xFAp l\u1EDBn \u0111\u1ED3ng \u0111\u1EC1u v\xE0 chuy\u1EC3n \u0111\u1ED5i th\u1EE9c \u0103n t\u1ED1t; th\u1EA5t th\u01B0\u1EDDng g\xE2y \u0111\xF3i, c\u1EA1nh tranh v\xE0 l\xE3ng ph\xED."},thresholds:{en:"2\u20133 feeds per day is good; 1 feed per day needs attention; irregular/inconsistent feeding is a priority.",vi:"2\u20133 l\u1EA7n/ng\xE0y l\xE0 t\u1ED1t; 1 l\u1EA7n/ng\xE0y c\u1EA7n ch\xFA \xFD; cho \u0103n kh\xF4ng \u0111\u1EC1u/th\u1EA5t th\u01B0\u1EDDng l\xE0 \u01B0u ti\xEAn."},tip:{en:"Feed on a set schedule and adjust the amount to the feeding response, not a fixed habit.",vi:"Cho \u0103n theo l\u1ECBch c\u1ED1 \u0111\u1ECBnh v\xE0 \u0111i\u1EC1u ch\u1EC9nh l\u01B0\u1EE3ng theo ph\u1EA3n \u1EE9ng b\u1EAFt m\u1ED3i, kh\xF4ng theo th\xF3i quen c\u1ED1 \u0111\u1ECBnh."}},fcr:{what:{en:"Feed conversion ratio \u2014 kg of feed per kg of fish growth.",vi:"H\u1EC7 s\u1ED1 chuy\u1EC3n \u0111\u1ED5i th\u1EE9c \u0103n \u2014 kg th\u1EE9c \u0103n cho m\u1ED7i kg c\xE1 t\u0103ng tr\u1ECDng."},why:{en:"FCR reflects both feed efficiency and fish welfare: stressed fish in poor water convert feed badly. High FCR also means more waste polluting the pond.",vi:"FCR ph\u1EA3n \xE1nh c\u1EA3 hi\u1EC7u qu\u1EA3 th\u1EE9c \u0103n v\xE0 ph\xFAc l\u1EE3i c\xE1: c\xE1 c\u0103ng th\u1EB3ng trong n\u01B0\u1EDBc x\u1EA5u chuy\u1EC3n h\xF3a k\xE9m. FCR cao c\xF2n ngh\u0129a l\xE0 nhi\u1EC1u ch\u1EA5t th\u1EA3i l\xE0m \xF4 nhi\u1EC5m ao."},thresholds:{en:"On-target and recorded is good; above target with some waste needs attention; high FCR with visible waste feed is a priority.",vi:"\u0110\u1EA1t m\u1EE5c ti\xEAu v\xE0 c\xF3 ghi ch\xE9p l\xE0 t\u1ED1t; cao h\u01A1n v\xE0 c\xF3 hao ph\xED c\u1EA7n ch\xFA \xFD; FCR cao v\u1EDBi th\u1EE9c \u0103n th\u1EEBa th\u1EA5y r\xF5 l\xE0 \u01B0u ti\xEAn."},tip:{en:"Track feed used vs weight gain each cycle; rising FCR is an early warning to check water and health.",vi:"Theo d\xF5i th\u1EE9c \u0103n d\xF9ng so v\u1EDBi t\u0103ng tr\u1ECDng m\u1ED7i v\u1EE5; FCR t\u0103ng l\xE0 c\u1EA3nh b\xE1o s\u1EDBm \u0111\u1EC3 ki\u1EC3m tra n\u01B0\u1EDBc v\xE0 s\u1EE9c kh\u1ECFe."}},surfacing:{what:{en:"How often fish rise to gulp air at the surface.",vi:"T\u1EA7n su\u1EA5t c\xE1 ngoi l\xEAn \u0111\u1EDBp kh\xED \u1EDF m\u1EB7t n\u01B0\u1EDBc."},why:{en:"Pangasius breathe air more as oxygen falls, so frequent surfacing is a direct behavioural sign of low dissolved oxygen and stress \u2014 visible without instruments.",vi:"C\xE1 tra th\u1EDF kh\xED tr\u1EDDi nhi\u1EC1u h\u01A1n khi oxy gi\u1EA3m, n\xEAn ngoi l\xEAn th\u01B0\u1EDDng xuy\xEAn l\xE0 d\u1EA5u hi\u1EC7u h\xE0nh vi tr\u1EF1c ti\u1EBFp c\u1EE7a thi\u1EBFu oxy v\xE0 c\u0103ng th\u1EB3ng \u2014 th\u1EA5y \u0111\u01B0\u1EE3c m\xE0 kh\xF4ng c\u1EA7n thi\u1EBFt b\u1ECB."},thresholds:{en:"Occasional surfacing is normal; frequent surfacing needs attention; constant gasping at the surface is a priority.",vi:"Th\u1EC9nh tho\u1EA3ng ngoi l\xEAn l\xE0 b\xECnh th\u01B0\u1EDDng; ngoi l\xEAn th\u01B0\u1EDDng xuy\xEAn c\u1EA7n ch\xFA \xFD; li\xEAn t\u1EE5c ng\xE1p \u1EDF m\u1EB7t n\u01B0\u1EDBc l\xE0 \u01B0u ti\xEAn."},tip:{en:"Treat increased surfacing as an oxygen alarm \u2014 increase aeration and check DO at once.",vi:"Xem vi\u1EC7c ngoi l\xEAn nhi\u1EC1u l\xE0 b\xE1o \u0111\u1ED9ng oxy \u2014 t\u0103ng s\u1EE5c kh\xED v\xE0 ki\u1EC3m tra DO ngay."}},swimming:{what:{en:"Normal swimming and ability to keep balance.",vi:"B\u01A1i b\xECnh th\u01B0\u1EDDng v\xE0 kh\u1EA3 n\u0103ng gi\u1EEF th\u0103ng b\u1EB1ng."},why:{en:"Erratic swimming or loss of equilibrium indicates serious stress, disease, toxicity or oxygen failure and usually precedes mortality.",vi:"B\u01A1i lo\u1EA1n ho\u1EB7c m\u1EA5t th\u0103ng b\u1EB1ng cho th\u1EA5y c\u0103ng th\u1EB3ng n\u1EB7ng, b\u1EC7nh, ng\u1ED9 \u0111\u1ED9c ho\u1EB7c thi\u1EBFu oxy v\xE0 th\u01B0\u1EDDng x\u1EA3y ra tr\u01B0\u1EDBc khi ch\u1EBFt."},thresholds:{en:"Normal balanced swimming is good; occasional erratic swimming needs attention; loss of equilibrium is a priority.",vi:"B\u01A1i c\xE2n b\u1EB1ng b\xECnh th\u01B0\u1EDDng l\xE0 t\u1ED1t; th\u1EC9nh tho\u1EA3ng b\u01A1i lo\u1EA1n c\u1EA7n ch\xFA \xFD; m\u1EA5t th\u0103ng b\u1EB1ng l\xE0 \u01B0u ti\xEAn."},tip:{en:"Investigate immediately \u2014 check oxygen, water quality and signs of disease.",vi:"\u0110i\u1EC1u tra ngay \u2014 ki\u1EC3m tra oxy, ch\u1EA5t l\u01B0\u1EE3ng n\u01B0\u1EDBc v\xE0 d\u1EA5u hi\u1EC7u b\u1EC7nh."}},"distribution-b":{what:{en:"How fish are spread through the pond or tank.",vi:"C\xE1ch c\xE1 ph\xE2n b\u1ED1 trong ao ho\u1EB7c b\u1EC3."},why:{en:"Heavy clustering in one area usually means fish are avoiding poor conditions (low oxygen, hot spots), crowding into the best water and effectively raising local density.",vi:"T\u1EE5 t\u1EADp d\xE0y m\u1ED9t ch\u1ED7 th\u01B0\u1EDDng ngh\u0129a l\xE0 c\xE1 \u0111ang tr\xE1nh \u0111i\u1EC1u ki\u1EC7n x\u1EA5u (thi\u1EBFu oxy, v\xF9ng n\xF3ng), d\u1ED3n v\xE0o v\xF9ng n\u01B0\u1EDBc t\u1ED1t v\xE0 l\xE0m t\u0103ng m\u1EADt \u0111\u1ED9 c\u1EE5c b\u1ED9."},thresholds:{en:"Using the available space evenly is good; some clustering needs attention; heavy clustering is a priority.",vi:"D\xF9ng \u0111\u1EC1u kh\xF4ng gian l\xE0 t\u1ED1t; t\u1EE5 m\u1ED9t s\u1ED1 ch\u1ED7 c\u1EA7n ch\xFA \xFD; t\u1EE5 d\xE0y \u0111\u1EB7c l\xE0 \u01B0u ti\xEAn."},tip:{en:"Find and fix the cause of avoided areas \u2014 often low oxygen or inflow problems.",vi:"T\xECm v\xE0 kh\u1EAFc ph\u1EE5c nguy\xEAn nh\xE2n v\xF9ng b\u1ECB tr\xE1nh \u2014 th\u01B0\u1EDDng l\xE0 thi\u1EBFu oxy ho\u1EB7c v\u1EA5n \u0111\u1EC1 n\u01B0\u1EDBc c\u1EA5p."}},disturbance:{what:{en:"How fish react to a sudden disturbance and how fast they settle.",vi:"C\xE1ch c\xE1 ph\u1EA3n \u1EE9ng khi b\u1ECB \u0111\u1ED9ng b\u1EA5t ng\u1EDD v\xE0 t\u1ED1c \u0111\u1ED9 \u1ED5n \u0111\u1ECBnh l\u1EA1i."},why:{en:"A normal startle that settles quickly indicates healthy, unstressed fish. No response, or prolonged panic and piling, signals sickness or chronic stress.",vi:"Gi\u1EADt m\xECnh b\xECnh th\u01B0\u1EDDng r\u1ED3i nhanh \u1ED5n \u0111\u1ECBnh cho th\u1EA5y c\xE1 kh\u1ECFe, kh\xF4ng c\u0103ng th\u1EB3ng. Kh\xF4ng ph\u1EA3n \u1EE9ng, ho\u1EB7c ho\u1EA3ng lo\u1EA1n v\xE0 ch\u1ED3ng \u0111\u1ED1ng k\xE9o d\xE0i, b\xE1o b\u1EC7nh ho\u1EB7c c\u0103ng th\u1EB3ng m\xE3n t\xEDnh."},thresholds:{en:"Normal response that settles quickly is good; exaggerated or sluggish needs attention; no response or panic/piling is a priority.",vi:"Ph\u1EA3n \u1EE9ng b\xECnh th\u01B0\u1EDDng r\u1ED3i \u1ED5n \u0111\u1ECBnh l\xE0 t\u1ED1t; qu\xE1 m\u1EE9c ho\u1EB7c ch\u1EADm ch\u1EA1p c\u1EA7n ch\xFA \xFD; kh\xF4ng ph\u1EA3n \u1EE9ng ho\u1EB7c ho\u1EA3ng lo\u1EA1n/ch\u1ED3ng \u0111\u1ED1ng l\xE0 \u01B0u ti\xEAn."},tip:{en:"Observe quietly at feeding; note any change from the fish's usual behaviour.",vi:"Quan s\xE1t l\u1EB7ng l\u1EBD l\xFAc cho \u0103n; ghi nh\u1EADn thay \u0111\u1ED5i so v\u1EDBi t\u1EADp t\xEDnh th\u01B0\u1EDDng ng\xE0y."}},observation:{what:{en:"How often fish are visually checked for health and behaviour.",vi:"T\u1EA7n su\u1EA5t quan s\xE1t c\xE1 v\u1EC1 s\u1EE9c kh\u1ECFe v\xE0 t\u1EADp t\xEDnh."},why:{en:"Daily visual checks catch disease and stress early, without handling the fish. They are the cheapest, least invasive welfare tool a farmer has.",vi:"Quan s\xE1t h\xE0ng ng\xE0y ph\xE1t hi\u1EC7n b\u1EC7nh v\xE0 c\u0103ng th\u1EB3ng s\u1EDBm m\xE0 kh\xF4ng c\u1EA7n b\u1EAFt c\xE1. \u0110\xE2y l\xE0 c\xF4ng c\u1EE5 ph\xFAc l\u1EE3i r\u1EBB nh\u1EA5t, \xEDt x\xE2m l\u1EA5n nh\u1EA5t c\u1EE7a ng\u01B0\u1EDDi nu\xF4i."},thresholds:{en:"Daily is good; weekly needs attention; monthly or less is a priority.",vi:"H\xE0ng ng\xE0y l\xE0 t\u1ED1t; h\xE0ng tu\u1EA7n c\u1EA7n ch\xFA \xFD; h\xE0ng th\xE1ng ho\u1EB7c \xEDt h\u01A1n l\xE0 \u01B0u ti\xEAn."},tip:{en:"Observe at feeding and in the early morning, when problems show first.",vi:"Quan s\xE1t l\xFAc cho \u0103n v\xE0 s\xE1ng s\u1EDBm, khi v\u1EA5n \u0111\u1EC1 xu\u1EA5t hi\u1EC7n \u0111\u1EA7u ti\xEAn."}},mortality:{what:{en:"Whether deaths are counted, recorded, and their causes investigated.",vi:"Vi\u1EC7c c\xE1 ch\u1EBFt c\xF3 \u0111\u01B0\u1EE3c \u0111\u1EBFm, ghi ch\xE9p v\xE0 t\xECm nguy\xEAn nh\xE2n hay kh\xF4ng."},why:{en:"Mortality records reveal trends and outbreaks early. Logging causes lets you act on the real problem instead of guessing, and is essential for any welfare or certification claim.",vi:"Ghi ch\xE9p c\xE1 ch\u1EBFt gi\xFAp ph\xE1t hi\u1EC7n xu h\u01B0\u1EDBng v\xE0 d\u1ECBch b\u1EC7nh s\u1EDBm. Ghi nguy\xEAn nh\xE2n gi\xFAp x\u1EED l\xFD \u0111\xFAng v\u1EA5n \u0111\u1EC1 thay v\xEC \u0111o\xE1n, v\xE0 c\u1EA7n thi\u1EBFt cho m\u1ECDi tuy\xEAn b\u1ED1 ph\xFAc l\u1EE3i hay ch\u1EE9ng nh\u1EADn."},thresholds:{en:"Daily records with causes logged is good; some recording without investigation needs attention; no recording is a priority.",vi:"Ghi h\xE0ng ng\xE0y k\xE8m nguy\xEAn nh\xE2n l\xE0 t\u1ED1t; c\xF3 ghi nh\u01B0ng kh\xF4ng \u0111i\u1EC1u tra c\u1EA7n ch\xFA \xFD; kh\xF4ng ghi l\xE0 \u01B0u ti\xEAn."},tip:{en:"Keep a simple daily mortality log per pond; a sudden rise is your earliest disease warning.",vi:"Ghi nh\u1EADt k\xFD c\xE1 ch\u1EBFt h\xE0ng ng\xE0y cho m\u1ED7i ao; t\u0103ng \u0111\u1ED9t ng\u1ED9t l\xE0 c\u1EA3nh b\xE1o b\u1EC7nh s\u1EDBm nh\u1EA5t."}},vaccination:{what:{en:"Whether fingerlings are vaccinated against key bacterial diseases.",vi:"C\xE1 gi\u1ED1ng c\xF3 \u0111\u01B0\u1EE3c ti\xEAm ph\xF2ng c\xE1c b\u1EC7nh vi khu\u1EA9n ch\xEDnh hay kh\xF4ng."},why:{en:"Vaccination prevents disease before it starts, cutting mortality and the need for antibiotics. Trials show up to 90% protection against MAS and 70% against BNP.",vi:"Ti\xEAm ph\xF2ng ng\u0103n b\u1EC7nh t\u1EEB \u0111\u1EA7u, gi\u1EA3m ch\u1EBFt v\xE0 nhu c\u1EA7u kh\xE1ng sinh. Th\u1EED nghi\u1EC7m cho th\u1EA5y b\u1EA3o v\u1EC7 t\u1EDBi 90% v\u1EDBi MAS v\xE0 70% v\u1EDBi BNP."},thresholds:{en:"Fingerlings vaccinated (\u224810\u201315 g) against MAS/BNP is good; partial or inconsistent needs attention; none is a priority.",vi:"C\xE1 gi\u1ED1ng \u0111\u01B0\u1EE3c ti\xEAm (\u224810\u201315 g) v\u1EDBi MAS/BNP l\xE0 t\u1ED1t; m\u1ED9t ph\u1EA7n ho\u1EB7c kh\xF4ng \u0111\u1EC1u c\u1EA7n ch\xFA \xFD; kh\xF4ng ti\xEAm l\xE0 \u01B0u ti\xEAn."},tip:{en:"Vaccinate fingerlings before transfer to grow-out, when handling is already happening.",vi:"Ti\xEAm cho c\xE1 gi\u1ED1ng tr\u01B0\u1EDBc khi chuy\u1EC3n sang nu\xF4i th\u1ECBt, l\xFAc \u0111\xE3 ph\u1EA3i b\u1EAFt c\xE1."}},treatment:{what:{en:"Whether treatments are based on a confirmed diagnosis and avoid banned/routine antibiotics.",vi:"Vi\u1EC7c \u0111i\u1EC1u tr\u1ECB c\xF3 d\u1EF1a tr\xEAn ch\u1EA9n \u0111o\xE1n x\xE1c \u0111\u1ECBnh v\xE0 tr\xE1nh kh\xE1ng sinh c\u1EA5m/d\xF9ng th\u01B0\u1EDDng xuy\xEAn hay kh\xF4ng."},why:{en:"Treating without diagnosis wastes money, harms fish and breeds antibiotic resistance. Routine or banned antibiotics (e.g. Enrofloxacin) also risk export rejection and public health.",vi:"\u0110i\u1EC1u tr\u1ECB kh\xF4ng ch\u1EA9n \u0111o\xE1n g\xE2y t\u1ED1n k\xE9m, h\u1EA1i c\xE1 v\xE0 t\u1EA1o kh\xE1ng kh\xE1ng sinh. Kh\xE1ng sinh d\xF9ng th\u01B0\u1EDDng xuy\xEAn ho\u1EB7c b\u1ECB c\u1EA5m (vd Enrofloxacin) c\xF2n r\u1EE7i ro b\u1ECB t\u1EEB ch\u1ED1i xu\u1EA5t kh\u1EA9u v\xE0 h\u1EA1i s\u1EE9c kh\u1ECFe c\u1ED9ng \u0111\u1ED3ng."},thresholds:{en:"Treatment on confirmed diagnosis is good; recorded but unconfirmed needs attention; routine/prophylactic or banned antibiotics is a priority.",vi:"\u0110i\u1EC1u tr\u1ECB theo ch\u1EA9n \u0111o\xE1n x\xE1c \u0111\u1ECBnh l\xE0 t\u1ED1t; c\xF3 ghi nh\u01B0ng ch\u01B0a x\xE1c \u0111\u1ECBnh c\u1EA7n ch\xFA \xFD; d\xF9ng th\u01B0\u1EDDng xuy\xEAn/ph\xF2ng ng\u1EEBa ho\u1EB7c kh\xE1ng sinh c\u1EA5m l\xE0 \u01B0u ti\xEAn."},tip:{en:"Use sensitivity testing or vet diagnosis before treating; never use banned products.",vi:"D\xF9ng kh\xE1ng sinh \u0111\u1ED3 ho\u1EB7c ch\u1EA9n \u0111o\xE1n th\xFA y tr\u01B0\u1EDBc khi \u0111i\u1EC1u tr\u1ECB; kh\xF4ng d\xF9ng s\u1EA3n ph\u1EA9m b\u1ECB c\u1EA5m."}},"frequency-h":{what:{en:"How often fish are caught or handled.",vi:"T\u1EA7n su\u1EA5t b\u1EAFt ho\u1EB7c thao t\xE1c v\u1EDBi c\xE1."},why:{en:"Every handling event stresses fish and risks injury. Necessary, planned handling (grading, harvest) is acceptable; routine handling without reason is harmful.",vi:"M\u1ED7i l\u1EA7n b\u1EAFt c\xE1 \u0111\u1EC1u g\xE2y c\u0103ng th\u1EB3ng v\xE0 r\u1EE7i ro th\u01B0\u01A1ng t\xEDch. B\u1EAFt c\u1EA7n thi\u1EBFt, c\xF3 k\u1EBF ho\u1EA1ch (ph\xE2n c\u1EE1, thu ho\u1EA1ch) ch\u1EA5p nh\u1EADn \u0111\u01B0\u1EE3c; b\u1EAFt th\u01B0\u1EDDng xuy\xEAn kh\xF4ng l\xFD do l\xE0 c\xF3 h\u1EA1i."},thresholds:{en:"Only when necessary and planned is good; occasional unnecessary handling needs attention; frequent/routine handling is a priority.",vi:"Ch\u1EC9 khi c\u1EA7n v\xE0 c\xF3 k\u1EBF ho\u1EA1ch l\xE0 t\u1ED1t; \u0111\xF4i khi b\u1EAFt kh\xF4ng c\u1EA7n thi\u1EBFt c\u1EA7n ch\xFA \xFD; b\u1EAFt th\u01B0\u1EDDng xuy\xEAn l\xE0 \u01B0u ti\xEAn."},tip:{en:"Combine tasks into planned events to reduce the number of handling episodes.",vi:"G\u1ED9p c\xE1c vi\u1EC7c v\xE0o s\u1EF1 ki\u1EC7n c\xF3 k\u1EBF ho\u1EA1ch \u0111\u1EC3 gi\u1EA3m s\u1ED1 l\u1EA7n b\u1EAFt c\xE1."}},timeout:{what:{en:"How long fish are kept out of the water during handling.",vi:"Th\u1EDDi gian c\xE1 \u1EDF ngo\xE0i n\u01B0\u1EDBc khi thao t\xE1c."},why:{en:"Out of water, fish cannot breathe properly and suffer stress and oxygen deprivation within minutes. Long air exposure also damages flesh quality.",vi:"Ngo\xE0i n\u01B0\u1EDBc, c\xE1 kh\xF4ng th\u1EDF \u0111\u01B0\u1EE3c v\xE0 b\u1ECB c\u0103ng th\u1EB3ng, thi\u1EBFu oxy ch\u1EC9 trong v\xE0i ph\xFAt. Ph\u01A1i kh\xED l\xE2u c\xF2n l\xE0m gi\u1EA3m ch\u1EA5t l\u01B0\u1EE3ng th\u1ECBt."},thresholds:{en:"Minimal time and kept moist is good; up to a few minutes needs attention; prolonged exposure or dry stacking is a priority. Best-practice target at slaughter handling: fish out of water no longer than 15 seconds (Humane Slaughter Association 2016).",vi:"Th\u1EDDi gian r\u1EA5t ng\u1EAFn v\xE0 gi\u1EEF \u1EA9m l\xE0 t\u1ED1t; v\xE0i ph\xFAt c\u1EA7n ch\xFA \xFD; ph\u01A1i l\xE2u ho\u1EB7c ch\u1EA5t kh\xF4 l\xE0 \u01B0u ti\xEAn. M\u1EE5c ti\xEAu th\u1EF1c h\xE0nh t\u1ED1t khi thao t\xE1c gi\u1EBFt m\u1ED5: c\xE1 ra kh\u1ECFi n\u01B0\u1EDBc kh\xF4ng qu\xE1 15 gi\xE2y (Humane Slaughter Association 2016)."},tip:{en:"Use water-flow trays or pumping systems so fish stay wet during transfer; avoid braille nets for moving fish out of water.",vi:"D\xF9ng m\xE1ng n\u01B0\u1EDBc ch\u1EA3y ho\u1EB7c h\u1EC7 th\u1ED1ng b\u01A1m \u0111\u1EC3 c\xE1 lu\xF4n \u01B0\u1EDBt khi chuy\u1EC3n; tr\xE1nh d\xF9ng l\u01B0\u1EDBi braille \u0111\u1EC3 \u0111\u01B0a c\xE1 ra kh\u1ECFi n\u01B0\u1EDBc."}},method:{what:{en:"The gentleness of the handling method used.",vi:"M\u1EE9c \u0111\u1ED9 nh\u1EB9 nh\xE0ng c\u1EE7a ph\u01B0\u01A1ng ph\xE1p b\u1EAFt c\xE1."},why:{en:"Rough handling and stacking fish in baskets causes crushing, scale loss and puncture wounds that become infection routes. Gentle methods protect both welfare and product quality.",vi:"B\u1EAFt th\xF4 b\u1EA1o v\xE0 ch\u1EA5t c\xE1 trong r\u1ED5 g\xE2y \u0111\xE8 b\u1EB9p, tr\xF3c v\u1EA3y v\xE0 v\u1EBFt th\u1EE7ng d\u1EABn \u0111\u1EBFn nhi\u1EC5m tr\xF9ng. Ph\u01B0\u01A1ng ph\xE1p nh\u1EB9 nh\xE0ng b\u1EA3o v\u1EC7 c\u1EA3 ph\xFAc l\u1EE3i v\xE0 ch\u1EA5t l\u01B0\u1EE3ng s\u1EA3n ph\u1EA9m."},thresholds:{en:"Soft mesh or fish pumps is good; careful manual handling needs attention; rough handling with crushing is a priority.",vi:"L\u01B0\u1EDBi m\u1EC1m ho\u1EB7c b\u01A1m c\xE1 l\xE0 t\u1ED1t; thao t\xE1c tay c\u1EA9n th\u1EADn c\u1EA7n ch\xFA \xFD; b\u1EAFt th\xF4 b\u1EA1o g\xE2y \u0111\xE8 b\u1EB9p l\xE0 \u01B0u ti\xEAn."},tip:{en:"Switch to soft knotless mesh and avoid stacking fish under their own weight.",vi:"Chuy\u1EC3n sang l\u01B0\u1EDBi m\u1EC1m kh\xF4ng g\xFAt v\xE0 tr\xE1nh ch\u1EA5t c\xE1 \u0111\xE8 l\xEAn nhau."}},crowd:{what:{en:"How tightly fish are crowded during grading/harvest.",vi:"M\u1EE9c \u0111\u1ED9 d\u1ED3n c\xE1 khi ph\xE2n c\u1EE1/thu ho\u1EA1ch."},why:{en:"Intense crowding causes oxygen crashes, injury and panic. Fish that lose posture or pile up are in acute distress.",vi:"D\u1ED3n c\xE1 qu\xE1 m\u1EE9c g\xE2y s\u1EE5t oxy, th\u01B0\u01A1ng t\xEDch v\xE0 ho\u1EA3ng lo\u1EA1n. C\xE1 m\u1EA5t t\u01B0 th\u1EBF ho\u1EB7c ch\u1ED3ng \u0111\u1ED1ng l\xE0 \u0111ang c\u0103ng th\u1EB3ng c\u1EA5p t\xEDnh."},thresholds:{en:"Brief crowding where fish keep posture is good; moderate crowding with agitation needs attention; extreme crowding with loss of equilibrium is a priority. Best practice (Humane Slaughter Association 2016): keep crowding under 2 hours and avoid repeating it, never pull nets tight, and keep dissolved oxygen within the normal target range (see Dissolved oxygen) throughout.",vi:"D\u1ED3n ng\u1EAFn m\xE0 c\xE1 gi\u1EEF t\u01B0 th\u1EBF l\xE0 t\u1ED1t; d\u1ED3n v\u1EEBa v\xE0 c\xE1 xao \u0111\u1ED9ng c\u1EA7n ch\xFA \xFD; d\u1ED3n c\u1EF1c \u0111\u1ED9 v\xE0 m\u1EA5t th\u0103ng b\u1EB1ng l\xE0 \u01B0u ti\xEAn. Th\u1EF1c h\xE0nh t\u1ED1t (Humane Slaughter Association 2016): d\u1ED3n d\u01B0\u1EDBi 2 gi\u1EDD v\xE0 kh\xF4ng l\u1EB7p l\u1EA1i, kh\xF4ng k\xE9o l\u01B0\u1EDBi qu\xE1 ch\u1EB7t, v\xE0 gi\u1EEF oxy h\xF2a tan trong kho\u1EA3ng m\u1EE5c ti\xEAu b\xECnh th\u01B0\u1EDDng (xem Oxy h\xF2a tan) su\u1ED1t qu\xE1 tr\xECnh."},tip:{en:"Crowd in smaller batches for shorter times, loosen nets if fish show escape behaviour, and keep oxygen up.",vi:"D\u1ED3n theo m\u1EBB nh\u1ECF trong th\u1EDDi gian ng\u1EAFn, n\u1EDBi l\u01B0\u1EDBi n\u1EBFu c\xE1 t\xECm c\xE1ch tho\xE1t, v\xE0 gi\u1EEF oxy cao."}},transport:{what:{en:"Density and oxygenation of fish during transport.",vi:"M\u1EADt \u0111\u1ED9 v\xE0 s\u1EE5c kh\xED cho c\xE1 khi v\u1EADn chuy\u1EC3n."},why:{en:"Transport is one of the most stressful stages: high density without aeration causes oxygen depletion and mortality (commonly 2\u201310%). Good conditions protect survival and welfare.",vi:"V\u1EADn chuy\u1EC3n l\xE0 m\u1ED9t trong nh\u1EEFng giai \u0111o\u1EA1n c\u0103ng th\u1EB3ng nh\u1EA5t: m\u1EADt \u0111\u1ED9 cao kh\xF4ng s\u1EE5c kh\xED g\xE2y thi\u1EBFu oxy v\xE0 ch\u1EBFt (th\u01B0\u1EDDng 2\u201310%). \u0110i\u1EC1u ki\u1EC7n t\u1ED1t b\u1EA3o v\u1EC7 t\u1EF7 l\u1EC7 s\u1ED1ng v\xE0 ph\xFAc l\u1EE3i."},thresholds:{en:"\u224850\u201380 kg/m\xB3 (less for long trips) with aeration is good; higher density or limited air needs attention; very high density with no aeration is a priority.",vi:"\u224850\u201380 kg/m\xB3 (th\u1EA5p h\u01A1n cho chuy\u1EBFn d\xE0i) c\xF3 s\u1EE5c kh\xED l\xE0 t\u1ED1t; m\u1EADt \u0111\u1ED9 cao h\u01A1n ho\u1EB7c \xEDt kh\xED c\u1EA7n ch\xFA \xFD; r\u1EA5t cao v\xE0 kh\xF4ng s\u1EE5c kh\xED l\xE0 \u01B0u ti\xEAn."},tip:{en:"Lower density for longer trips and provide oxygen; mild anaesthetic (e.g. clove oil) can reduce stress. Salt (up to 3 ppt) helps reduce stress in transport, and water quality should be monitored throughout wellboat transport (Bui et al. 2010; Humane Slaughter Association 2016).",vi:"Gi\u1EA3m m\u1EADt \u0111\u1ED9 cho chuy\u1EBFn d\xE0i v\xE0 c\u1EA5p oxy; thu\u1ED1c m\xEA nh\u1EB9 (vd d\u1EA7u \u0111inh h\u01B0\u01A1ng) c\xF3 th\u1EC3 gi\u1EA3m c\u0103ng th\u1EB3ng. Mu\u1ED1i (t\u1EDBi 3 ppt) gi\xFAp gi\u1EA3m stress khi v\u1EADn chuy\u1EC3n, v\xE0 c\u1EA7n theo d\xF5i ch\u1EA5t l\u01B0\u1EE3ng n\u01B0\u1EDBc su\u1ED1t qu\xE1 tr\xECnh v\u1EADn chuy\u1EC3n b\u1EB1ng ghe \u0111\u1EE5c (Bui v\xE0 cs. 2010; Humane Slaughter Association 2016)."}},"transport-h":{what:{en:"How broodstock are moved for stripping and returned to the pond.",vi:"C\xE1ch di chuy\u1EC3n c\xE1 b\u1ED1 m\u1EB9 \u0111\u1EC3 vu\u1ED1t tr\u1EE9ng/tinh v\xE0 \u0111\u01B0a tr\u1EDF l\u1EA1i ao."},why:{en:"Unlike fingerlings (moved in boats/tanks), broodstock are typically taken from the pond to the hatchery for stripping, held in a tank, then returned. Each transfer is a handling stress point; rough or prolonged handling harms condition and future spawning.",vi:"Kh\xE1c v\u1EDBi c\xE1 gi\u1ED1ng (chuy\u1EC3n b\u1EB1ng ghe/b\u1EC3), c\xE1 b\u1ED1 m\u1EB9 th\u01B0\u1EDDng \u0111\u01B0\u1EE3c \u0111\u01B0a t\u1EEB ao \u0111\u1EBFn tr\u1EA1i \u0111\u1EC3 vu\u1ED1t, gi\u1EEF trong b\u1EC3 r\u1ED3i tr\u1EA3 v\u1EC1. M\u1ED7i l\u1EA7n chuy\u1EC3n l\xE0 m\u1ED9t \u0111i\u1EC3m g\xE2y stress; b\u1EAFt th\xF4 b\u1EA1o ho\u1EB7c k\xE9o d\xE0i l\xE0m h\u1EA1i th\u1EC3 tr\u1EA1ng v\xE0 kh\u1EA3 n\u0103ng sinh s\u1EA3n sau n\xE0y."},thresholds:{en:"Gentle, brief transfer at low density with aeration is good; some crowding or longer holding than needed needs attention; rough handling, high density or prolonged time out of the pond is a priority.",vi:"Chuy\u1EC3n nh\u1EB9 nh\xE0ng, nhanh, m\u1EADt \u0111\u1ED9 th\u1EA5p, c\xF3 s\u1EE5c kh\xED l\xE0 t\u1ED1t; h\u01A1i ch\u1EADt ho\u1EB7c gi\u1EEF l\xE2u h\u01A1n c\u1EA7n thi\u1EBFt c\u1EA7n ch\xFA \xFD; b\u1EAFt th\xF4 b\u1EA1o, m\u1EADt \u0111\u1ED9 cao ho\u1EB7c gi\u1EEF ngo\xE0i ao qu\xE1 l\xE2u l\xE0 \u01B0u ti\xEAn."},tip:{en:"Plan the route and timing so fish spend the least possible time out of the pond; keep holding tanks aerated.",vi:"L\xEAn k\u1EBF ho\u1EA1ch l\u1ED9 tr\xECnh v\xE0 th\u1EDDi gian \u0111\u1EC3 c\xE1 \u1EDF ngo\xE0i ao ng\u1EAFn nh\u1EA5t; gi\u1EEF b\u1EC3 ch\u1EE9a c\xF3 s\u1EE5c kh\xED."}},anaesthetic:{what:{en:"Whether a mild anaesthetic is used to calm fish during handling and transfer.",vi:"Vi\u1EC7c d\xF9ng thu\u1ED1c g\xE2y m\xEA nh\u1EB9 \u0111\u1EC3 l\xE0m d\u1ECBu c\xE1 khi b\u1EAFt v\xE0 v\u1EADn chuy\u1EC3n."},why:{en:"A mild anaesthetic (e.g. clove oil) reduces struggling, injury and stress during handling and transport. It is appropriate for broodstock, larvae/fry and fingerling handling and transfer \u2014 but NOT for grow-out fish being harvested for slaughter, where withdrawal/residue rules apply.",vi:"Thu\u1ED1c g\xE2y m\xEA nh\u1EB9 (vd d\u1EA7u \u0111inh h\u01B0\u01A1ng) gi\u1EA3m v\xF9ng v\u1EABy, th\u01B0\u01A1ng t\xEDch v\xE0 stress khi b\u1EAFt v\xE0 v\u1EADn chuy\u1EC3n. Ph\xF9 h\u1EE3p cho c\xE1 b\u1ED1 m\u1EB9, c\xE1 b\u1ED9t/h\u01B0\u01A1ng v\xE0 c\xE1 gi\u1ED1ng \u2014 nh\u01B0ng KH\xD4NG d\xF9ng cho c\xE1 nu\xF4i th\u1ECBt khi thu ho\u1EA1ch \u0111\u1EC3 gi\u1EBFt m\u1ED5, do quy \u0111\u1ECBnh v\u1EC1 th\u1EDDi gian ng\u01B0ng/t\u1ED3n d\u01B0."},thresholds:{en:"Used appropriately to reduce handling stress is good; occasional/inconsistent use needs attention; never used despite stressful handling is a priority.",vi:"D\xF9ng h\u1EE3p l\xFD \u0111\u1EC3 gi\u1EA3m stress khi b\u1EAFt l\xE0 t\u1ED1t; d\xF9ng th\u1EC9nh tho\u1EA3ng/kh\xF4ng \u0111\u1EC1u c\u1EA7n ch\xFA \xFD; kh\xF4ng bao gi\u1EDD d\xF9ng d\xF9 vi\u1EC7c b\u1EAFt g\xE2y stress l\xE0 \u01B0u ti\xEAn."},tip:{en:"Use a recognised fish anaesthetic at the correct dose; do not use on grow-out fish destined for harvest/slaughter.",vi:"D\xF9ng thu\u1ED1c g\xE2y m\xEA c\xE1 \u0111\u01B0\u1EE3c c\xF4ng nh\u1EADn v\u1EDBi li\u1EC1u \u0111\xFAng; kh\xF4ng d\xF9ng cho c\xE1 nu\xF4i th\u1ECBt s\u1EAFp thu ho\u1EA1ch/gi\u1EBFt m\u1ED5."}},stunning:{what:{en:"Whether fish are stunned (made insensible) before slaughter.",vi:"C\xE1 c\xF3 \u0111\u01B0\u1EE3c g\xE2y m\xEA (l\xE0m m\u1EA5t c\u1EA3m gi\xE1c) tr\u01B0\u1EDBc khi gi\u1EBFt m\u1ED5 hay kh\xF4ng."},why:{en:"Cutting gills without stunning leaves fish conscious during bleed-out \u2014 prolonged suffering. Stunning, ideally electrical in water, prevents this and also improves fillet quality.",vi:"C\u1EAFt mang m\xE0 kh\xF4ng g\xE2y m\xEA khi\u1EBFn c\xE1 c\xF2n t\u1EC9nh khi c\u1EAFt ti\u1EBFt \u2014 \u0111au \u0111\u1EDBn k\xE9o d\xE0i. G\xE2y m\xEA, l\xFD t\u01B0\u1EDFng l\xE0 \u0111i\u1EC7n trong n\u01B0\u1EDBc, ng\u0103n \u0111i\u1EC1u n\xE0y v\xE0 c\xF2n c\u1EA3i thi\u1EC7n ch\u1EA5t l\u01B0\u1EE3ng phi l\xEA."},thresholds:{en:"All fish stunned (electrical, in water) is good; inconsistent stunning needs attention; no stunning is a priority.",vi:"T\u1EA5t c\u1EA3 c\xE1 \u0111\u01B0\u1EE3c g\xE2y m\xEA (\u0111i\u1EC7n, trong n\u01B0\u1EDBc) l\xE0 t\u1ED1t; g\xE2y m\xEA kh\xF4ng \u0111\u1EC1u c\u1EA7n ch\xFA \xFD; kh\xF4ng g\xE2y m\xEA l\xE0 \u01B0u ti\xEAn."},tip:{en:"Apply stunning to all batches, not only EU-bound fish, and verify correct voltage/duration. Unacceptable methods that leave fish conscious or suffering include: gill cutting without stunning, death in ice slurry, live chilling, CO\u2082 narcosis, air exposure, and prolonged holding at wet markets (Humane Slaughter Association 2016; Kestin et al. 2018).",vi:"G\xE2y m\xEA cho m\u1ECDi m\u1EBB, kh\xF4ng ch\u1EC9 c\xE1 xu\u1EA5t EU, v\xE0 ki\u1EC3m tra \u0111\xFAng \u0111i\u1EC7n \xE1p/th\u1EDDi gian. C\xE1c ph\u01B0\u01A1ng ph\xE1p kh\xF4ng ch\u1EA5p nh\u1EADn \u0111\u01B0\u1EE3c khi\u1EBFn c\xE1 c\xF2n t\u1EC9nh ho\u1EB7c \u0111au \u0111\u1EDBn g\u1ED3m: c\u1EAFt mang kh\xF4ng g\xE2y m\xEA, cho ch\u1EBFt trong n\u01B0\u1EDBc \u0111\xE1, l\xE0m l\u1EA1nh s\u1ED1ng, g\xE2y m\xEA CO\u2082, ph\u01A1i kh\xED, v\xE0 gi\u1EEF l\xE2u \u1EDF ch\u1EE3 (Humane Slaughter Association 2016; Kestin v\xE0 cs. 2018)."}},stuncheck:{what:{en:"Whether fish are confirmed insensible before bleeding.",vi:"C\xE1 c\xF3 \u0111\u01B0\u1EE3c x\xE1c nh\u1EADn m\u1EA5t c\u1EA3m gi\xE1c tr\u01B0\u1EDBc khi c\u1EAFt ti\u1EBFt hay kh\xF4ng."},why:{en:"Stunning can fail or wear off. Signs of an EFFECTIVE stun (Humane Slaughter Association 2016): eye movement stops, no opercular (gill cover) movement, small muscle twitches, and the fish turns upside down. Signs of an INEFFECTIVE stun (fish likely still conscious): regular opercular/breathing movement and eye roll when the fish is rotated. Checking before bleeding is the difference between humane and inhumane slaughter.",vi:"G\xE2y m\xEA c\xF3 th\u1EC3 th\u1EA5t b\u1EA1i ho\u1EB7c h\u1EBFt t\xE1c d\u1EE5ng. D\u1EA5u hi\u1EC7u g\xE2y m\xEA HI\u1EC6U QU\u1EA2 (Humane Slaughter Association 2016): m\u1EAFt ng\u1EEBng c\u1EED \u0111\u1ED9ng, kh\xF4ng c\u1EED \u0111\u1ED9ng n\u1EAFp mang, c\xF3 co gi\u1EADt c\u01A1 nh\u1ECF, v\xE0 c\xE1 l\u1EADt ng\u1EEDa. D\u1EA5u hi\u1EC7u g\xE2y m\xEA KH\xD4NG hi\u1EC7u qu\u1EA3 (c\xE1 c\xF3 th\u1EC3 c\xF2n t\u1EC9nh): n\u1EAFp mang/h\xF4 h\u1EA5p c\u1EED \u0111\u1ED9ng \u0111\u1EC1u v\xE0 m\u1EAFt \u0111\u1EA3o khi xoay c\xE1. Ki\u1EC3m tra tr\u01B0\u1EDBc khi c\u1EAFt ti\u1EBFt l\xE0 ranh gi\u1EDBi gi\u1EEFa gi\u1EBFt m\u1ED5 nh\xE2n \u0111\u1EA1o v\xE0 kh\xF4ng."},thresholds:{en:"Checked insensible (using the signs above) before bleeding is good; occasional checks need attention; no checks with signs of consciousness is a priority. Target: 0% of fish showing signs of returning to consciousness \u2014 re-stun immediately if any do.",vi:"Ki\u1EC3m tra m\u1EA5t c\u1EA3m gi\xE1c (theo c\xE1c d\u1EA5u hi\u1EC7u tr\xEAn) tr\u01B0\u1EDBc khi c\u1EAFt ti\u1EBFt l\xE0 t\u1ED1t; th\u1EC9nh tho\u1EA3ng ki\u1EC3m tra c\u1EA7n ch\xFA \xFD; kh\xF4ng ki\u1EC3m tra v\xE0 c\xF3 d\u1EA5u hi\u1EC7u c\xF2n t\u1EC9nh l\xE0 \u01B0u ti\xEAn. M\u1EE5c ti\xEAu: 0% c\xE1 c\xF3 d\u1EA5u hi\u1EC7u t\u1EC9nh l\u1EA1i \u2014 g\xE2y m\xEA l\u1EA1i ngay n\u1EBFu c\xF3."},tip:{en:"Train staff to spot the consciousness signs above and re-stun any fish still moving.",vi:"Hu\u1EA5n luy\u1EC7n nh\xE2n vi\xEAn nh\u1EADn bi\u1EBFt c\xE1c d\u1EA5u hi\u1EC7u c\xF2n t\u1EC9nh \u1EDF tr\xEAn v\xE0 g\xE2y m\xEA l\u1EA1i c\xE1 c\xF2n c\u1EED \u0111\u1ED9ng."}},intake:{what:{en:"Whether incoming water is managed or treated before use.",vi:"N\u01B0\u1EDBc c\u1EA5p v\xE0o c\xF3 \u0111\u01B0\u1EE3c qu\u1EA3n l\xFD ho\u1EB7c x\u1EED l\xFD tr\u01B0\u1EDBc khi d\xF9ng hay kh\xF4ng."},why:{en:"Untreated intake water can carry pathogens straight into the pond. Filtration or settling reduces disease introduction \u2014 a key, often-neglected biosecurity step.",vi:"N\u01B0\u1EDBc c\u1EA5p ch\u01B0a x\u1EED l\xFD c\xF3 th\u1EC3 mang m\u1EA7m b\u1EC7nh th\u1EB3ng v\xE0o ao. L\u1ECDc ho\u1EB7c l\u1EAFng gi\u1EA3m \u0111\u01B0a b\u1EC7nh v\xE0o \u2014 b\u01B0\u1EDBc an to\xE0n sinh h\u1ECDc quan tr\u1ECDng nh\u01B0ng th\u01B0\u1EDDng b\u1ECB b\u1ECF qua."},thresholds:{en:"Managed or treated is good; some basic control needs attention; no management is a priority.",vi:"C\xF3 qu\u1EA3n l\xFD ho\u1EB7c x\u1EED l\xFD l\xE0 t\u1ED1t; ki\u1EC3m so\xE1t c\u01A1 b\u1EA3n c\u1EA7n ch\xFA \xFD; kh\xF4ng qu\u1EA3n l\xFD l\xE0 \u01B0u ti\xEAn."},tip:{en:"Use a settling pond or filtration on intake; even simple filter bags help.",vi:"D\xF9ng ao l\u1EAFng ho\u1EB7c l\u1ECDc n\u01B0\u1EDBc c\u1EA5p; ngay c\u1EA3 t\xFAi l\u1ECDc \u0111\u01A1n gi\u1EA3n c\u0169ng c\xF3 \xEDch."}},equipment:{what:{en:"Whether nets and equipment are cleaned between ponds.",vi:"L\u01B0\u1EDBi v\xE0 d\u1EE5ng c\u1EE5 c\xF3 \u0111\u01B0\u1EE3c v\u1EC7 sinh gi\u1EEFa c\xE1c ao hay kh\xF4ng."},why:{en:"Shared, dirty equipment spreads pathogens from pond to pond. Cleaning and disinfecting between uses is a cheap, high-impact biosecurity measure.",vi:"D\u1EE5ng c\u1EE5 d\xF9ng chung, b\u1EA9n l\xE2y m\u1EA7m b\u1EC7nh t\u1EEB ao n\xE0y sang ao kh\xE1c. V\u1EC7 sinh v\xE0 kh\u1EED tr\xF9ng gi\u1EEFa c\xE1c l\u1EA7n d\xF9ng l\xE0 bi\u1EC7n ph\xE1p an to\xE0n sinh h\u1ECDc r\u1EBB, hi\u1EC7u qu\u1EA3 cao."},t nh\u1EEFng c\xE1ch ph\u1ED5 bi\u1EBFn nh\u1EA5t khi\u1EBFn b\u1EC7nh x\xE2m nh\u1EADp tr\u1EA1i. Ngu\u1ED3n c\xF3 ch\u1EE9ng nh\u1EADn, ki\u1EC3m tra s\u1EE9c kh\u1ECFe v\xE0 c\xE1ch ly c\u1EAFt \u0111\u1EE9t con \u0111\u01B0\u1EDDng \u0111\xF3."},thresholds:{en:"Certified, health-checked, quarantined 2+ weeks is good; known source without health check needs attention; unknown source with no screening is a priority.",vi:"C\xF3 ch\u1EE9ng nh\u1EADn, ki\u1EC3m tra s\u1EE9c kh\u1ECFe, c\xE1ch ly 2+ tu\u1EA7n l\xE0 t\u1ED1t; bi\u1EBFt ngu\u1ED3n nh\u01B0ng kh\xF4ng ki\u1EC3m tra c\u1EA7n ch\xFA \xFD; kh\xF4ng r\xF5 ngu\u1ED3n v\xE0 kh\xF4ng s\xE0ng l\u1ECDc l\xE0 \u01B0u ti\xEAn."},tip:{en:"Quarantine new stock at least two weeks before introducing to production ponds.",vi:"C\xE1ch ly con gi\u1ED1ng m\u1EDBi \xEDt nh\u1EA5t hai tu\u1EA7n tr\u01B0\u1EDBc khi \u0111\u01B0a v\xE0o ao nu\xF4i."}},disposal:{what:{en:"How dead fish are removed and disposed of.",vi:"C\xE1ch v\u1EDBt v\xE0 x\u1EED l\xFD c\xE1 ch\u1EBFt."},why:{en:"Dead fish left in the pond or thrown into water channels spread disease and pollute water. Prompt, safe disposal protects the rest of the stock and neighbouring farms.",vi:"C\xE1 ch\u1EBFt \u0111\u1EC3 trong ao ho\u1EB7c th\u1EA3i ra k\xEAnh l\xE2y b\u1EC7nh v\xE0 \xF4 nhi\u1EC5m n\u01B0\u1EDBc. V\u1EDBt v\xE0 x\u1EED l\xFD k\u1ECBp th\u1EDDi, an to\xE0n b\u1EA3o v\u1EC7 \u0111\xE0n c\xE1 c\xF2n l\u1EA1i v\xE0 c\xE1c tr\u1EA1i l\xE2n c\u1EADn."},thresholds:{en:"Removed daily and disposed safely (buried/composted/incinerated) is good; irregular/inadequate disposal needs attention; rarely removed or dumped in channels is a priority.",vi:"V\u1EDBt h\xE0ng ng\xE0y v\xE0 x\u1EED l\xFD an to\xE0n (ch\xF4n/\u1EE7/\u0111\u1ED1t) l\xE0 t\u1ED1t; x\u1EED l\xFD kh\xF4ng \u0111\u1EC1u/ch\u01B0a \u0111\u1EA1t c\u1EA7n ch\xFA \xFD; hi\u1EBFm khi v\u1EDBt ho\u1EB7c th\u1EA3i ra k\xEAnh l\xE0 \u01B0u ti\xEAn."},tip:{en:"Remove mortalities daily and bury, compost or i
